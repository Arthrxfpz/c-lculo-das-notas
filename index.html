<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novo endereço</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --muted:#666; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --muted:#999; --accent:#7aa2ff; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    padding: 24px; background: var(--bg); color: var(--fg);
    font: 18px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 34rem; }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  a { color: var(--accent); word-break: break-all; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p>Esse site mudou de endereço URL e recebeu um novo nome. Para acessar o novo endereço, acesse aqui:</p>
  <p><a href="https://arthrxfpz.github.io/mediamais/">https://arthrxfpz.github.io/mediamais/</a></p>
</main>
</body>
</html>
