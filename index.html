<head>

  <!-- Redirecionamento automático via HTML (0 segundos) -->
  <meta http-equiv="refresh" content="0; url=https://arthrxfpz.github.io/mediamais/">

    window.location.replace("https://arthrxfpz.github.io/mediamais/");
  </script>

  <style>
    :root { --bg:#fff; --fg:#1a1a1a; --accent:#2563eb; }

    }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: 24px; background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, sans-serif; text-align: center;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>

    Redirecionando para o novo endereço...<br>
